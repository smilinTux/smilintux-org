name: Repository CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      skills-registry: ${{ steps.filter.outputs.skills-registry }}
      skseed: ${{ steps.filter.outputs.skseed }}
      varus: ${{ steps.filter.outputs.varus }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            skills-registry:
              - 'skills-registry/**'
            skseed:
              - 'skseed/**'
            varus:
              - 'varus/**'

  skills-registry:
    needs: detect-changes
    if: needs.detect-changes.outputs.skills-registry == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills-registry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check skills_registry/
      - run: python -m pytest tests/ -v --tb=short --cov=skills_registry --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-skills-registry
          path: skills-registry/coverage.xml
          if-no-files-found: ignore

  skseed:
    needs: detect-changes
    if: needs.detect-changes.outputs.skseed == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: skseed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]" pytest-cov
      - run: python -m pytest tests/ -v --tb=short --cov=skseed --cov-report=xml:coverage.xml
      - run: python -m ruff check skseed/
        if: matrix.python-version == '3.12'
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12' && always()
        with:
          name: coverage-skseed
          path: skseed/coverage.xml
          if-no-files-found: ignore

  varus:
    needs: detect-changes
    if: needs.detect-changes.outputs.varus == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: varus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]" pytest-cov
      - run: python -m pytest tests/ -v --tb=short --cov=varus --cov-report=xml:coverage.xml
      - run: python -m ruff check varus/
        if: matrix.python-version == '3.12'
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12' && always()
        with:
          name: coverage-varus
          path: varus/coverage.xml
          if-no-files-found: ignore

  all-tests:
    needs: [skills-registry, skseed, varus]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          SKILLS_REGISTRY_RESULT: ${{ needs.skills-registry.result }}
          SKSEED_RESULT: ${{ needs.skseed.result }}
          VARUS_RESULT: ${{ needs.varus.result }}
        run: |
          failed=0
          for result in \
            "skills-registry:$SKILLS_REGISTRY_RESULT" \
            "skseed:$SKSEED_RESULT" \
            "varus:$VARUS_RESULT"; do
            name=${result%%:*}
            status=${result#*:}
            printf '%-20s %s\n' "$name" "$status"
            case "$status" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done
          exit "$failed"
