name: Release repository packages to PyPI

# This repository now owns only the Python packages listed below. Packages
# split into dedicated repositories must be released from those repositories.
on:
  push:
    tags:
      - "skseed-v*"
      - "varus-v*"

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install repository packages
        run: |
          python -m pip install -e "skseed/[dev]"
          python -m pip install -e "varus/[dev]"
      - name: Test skseed
        run: python -m pytest skseed/tests/ -v --tb=short
      - name: Test varus
        run: python -m pytest varus/tests/ -v --tb=short

  resolve:
    runs-on: ubuntu-latest
    outputs:
      publish_skseed: ${{ steps.resolve.outputs.skseed }}
      publish_varus: ${{ steps.resolve.outputs.varus }}
    steps:
      - id: resolve
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            skseed-v*) echo "skseed=true" >> "$GITHUB_OUTPUT" ;;
            varus-v*) echo "varus=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported release tag: $TAG" >&2; exit 1 ;;
          esac

  publish-skseed:
    needs: [test, resolve]
    if: needs.resolve.outputs.publish_skseed == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install build twine
      - name: Build skseed
        working-directory: skseed
        run: python -m build
      - name: Verify skseed distribution
        working-directory: skseed
        run: twine check dist/*
      - name: Publish skseed
        working-directory: skseed
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_SKSEED_TOKEN }}

  publish-varus:
    needs: [test, resolve]
    if: needs.resolve.outputs.publish_varus == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install build twine
      - name: Build varus
        working-directory: varus
        run: python -m build
      - name: Verify varus distribution
        working-directory: varus
        run: twine check dist/*
      - name: Publish varus
        working-directory: varus
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_VARUS_TOKEN }}
